<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Admin — Elite Edge Sports Tips</title>
  <link rel="stylesheet" href="css/admin.css">
  <!-- FOUC prevention removed — was causing blank screen -->
</head>
<body>

  <!-- ====================================================
       LOGIN GATE
       ==================================================== -->
  <div id="loginGate" class="login-gate">
    <div class="login-card">
      <div class="brand">Elite Edge</div>
      <div class="brand-sub">Admin Panel</div>

      <div id="loginError" class="login-error">Invalid credentials. Please try again.</div>

      <form id="loginForm" autocomplete="off">
        <div class="form-group">
          <label for="loginEmail">Email</label>
          <input type="email" id="loginEmail" placeholder="admin@eliteedge.co.uk" required>
        </div>
        <div class="form-group">
          <label for="loginPassword">Password</label>
          <input type="password" id="loginPassword" placeholder="Enter password" required>
        </div>
        <button type="submit" class="btn btn-gold" style="width:100%;margin-top:0.5rem;">
          Sign In
        </button>
      </form>
    </div>
  </div>

  <!-- ====================================================
       ADMIN APP (hidden until authenticated)
       ==================================================== -->
  <div id="adminApp" class="admin-app hidden">

    <!-- Sidebar backdrop (mobile) -->
    <div id="sidebarBackdrop" class="sidebar-backdrop"></div>

    <!-- Sidebar -->
    <aside id="sidebar" class="sidebar">
      <div class="sidebar-header">
        <div class="logo">Elite Edge</div>
        <div class="logo-sub">Admin Panel</div>
      </div>

      <nav class="sidebar-nav">
        <a href="#dashboard" data-section="dashboard" class="active">
          <span class="nav-icon">&#9632;</span> Dashboard
        </a>
        <a href="#tips" data-section="tips">
          <span class="nav-icon">&#9733;</span> Tips Management
        </a>
        <a href="#results" data-section="results">
          <span class="nav-icon">&#9776;</span> Results &amp; Analytics
        </a>
        <a href="#users" data-section="users">
          <span class="nav-icon">&#9823;</span> Users
        </a>
        <a href="#email" data-section="email">
          <span class="nav-icon">&#9993;</span> Email Centre
        </a>
        <a href="#support" data-section="support">
          <span class="nav-icon">&#9998;</span> Support Tickets
        </a>
        <a href="#livedata" data-section="livedata">
          <span class="nav-icon">&#9889;</span> Live Data
        </a>
        <a href="#audit" data-section="audit">
          <span class="nav-icon">&#128220;</span> Audit Log
        </a>
        <a href="#/analytics" data-route="#/analytics">
          <span class="nav-icon">&#128202;</span> Selection Analytics
        </a>
      </nav>

      <div class="sidebar-footer">
        <div class="admin-avatar" id="adminAvatar">AD</div>
        <div class="admin-info">
          <div class="admin-name" id="adminName">Admin</div>
          <div class="admin-role">Super Admin</div>
        </div>
        <button class="btn-logout" id="btnLogout" title="Logout">&#10140;</button>
      </div>
    </aside>

    <!-- Main -->
    <div class="main-content">

      <!-- Top bar -->
      <header class="topbar">
        <div class="topbar-left">
          <button class="hamburger" id="hamburger" aria-label="Toggle menu">&#9776;</button>
          <div>
            <div class="page-title" id="pageTitle">Dashboard</div>
            <div class="page-subtitle" id="pageSubtitle">Overview of platform activity</div>
          </div>
        </div>
        <div class="topbar-right">
          <span class="text-sm text-muted" id="topbarDate"></span>
        </div>
      </header>

      <!-- Content body -->
      <main class="content-body">

        <!-- Shared content container — all page modules render here -->
        <div id="admin-content"></div>

        <!-- Section containers for routing (show/hide managed by admin.js) -->
        <div id="sec-dashboard" class="section active"></div>
        <div id="sec-tips" class="section"></div>
        <div id="sec-results" class="section"></div>
        <div id="sec-users" class="section"></div>
        <div id="sec-email" class="section"></div>
        <div id="sec-support" class="section"></div>
        <div id="sec-livedata" class="section"></div>
        <div id="sec-audit" class="section"></div>
        <div id="sec-analytics" class="section"></div>

      </main>
    </div>
  </div>

  <!-- ====================================================
       MODAL SYSTEM
       ==================================================== -->
  <div id="modalOverlay" class="modal-overlay">
    <div class="modal" id="modal">
      <div class="modal-header">
        <h3 id="modalTitle">Confirm</h3>
        <button class="modal-close" id="modalClose">&times;</button>
      </div>
      <div class="modal-body" id="modalBody"></div>
      <div class="modal-footer" id="modalFooter">
        <button class="btn btn-outline" id="modalCancel">Cancel</button>
        <button class="btn btn-gold" id="modalConfirm">Confirm</button>
      </div>
    </div>
  </div>

  <!-- ====================================================
       TOAST CONTAINER
       ==================================================== -->
  <div id="toastContainer" class="toast-container"></div>

  <!-- ====================================================
       SCRIPTS
       ==================================================== -->
  <script src="js/admin.js?v=20260504a"></script>
  <script src="js/dashboard.js?v=20260504a"></script>
  <script src="js/tips.js?v=20260504a"></script>
  <script src="js/results.js?v=20260504a"></script>
  <script src="js/users.js?v=20260504a"></script>
  <script src="js/email.js?v=20260504a"></script>
  <script src="js/support.js?v=20260504a"></script>
  <script src="js/livedata.js?v=20260504a"></script>
  <script src="js/audit.js?v=20260504a"></script>
  <script src="js/analytics.js?v=20260504a"></script>
</body>
</html>
