<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Elite Edge — World Cup Scorecard</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0a0e1a;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
    color: #fff;
    display: flex;
    justify-content: center;
    padding: 14px 10px;
  }
  .card {
    width: 100%;
    max-width: 400px;
    background: linear-gradient(160deg, #0f1426 0%, #0a0e1a 60%);
    border: 1px solid rgba(212,168,67,0.25);
    border-radius: 16px;
    padding: 18px 16px 14px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
  }
  .brand { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
  .brand .logo {
    width: 26px; height: 26px; border-radius: 7px;
    background: linear-gradient(135deg,#d4a843,#b8862a);
    display: flex; align-items: center; justify-content: center;
    font-weight: 900; color: #0a0e1a; font-size: 12px;
  }
  .brand .name { font-weight: 900; font-size: 13px; letter-spacing: 0.3px; }
  .brand .name span { color: #d4a843; }
  .kicker { font-size: 9px; color: rgba(255,255,255,0.4); font-weight: 700; text-transform: uppercase; letter-spacing: 1.2px; margin-bottom: 8px; }
  h1 { font-size: 20px; font-weight: 900; margin-bottom: 11px; line-height: 1.1; }
  h1 .gold { color: #d4a843; }

  .summary {
    display: flex; align-items: center; justify-content: space-between;
    background: linear-gradient(135deg, rgba(34,197,94,0.14), rgba(34,197,94,0.02));
    border: 1px solid rgba(34,197,94,0.3);
    border-radius: 12px; padding: 11px 14px; margin-bottom: 12px;
  }
  .summary .rec { font-size: 10px; color: rgba(255,255,255,0.55); font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; }
  .summary .big { font-size: 21px; font-weight: 900; line-height: 1.15; }
  .summary .big .mut { color: rgba(255,255,255,0.4); font-size: 14px; }
  .summary .rate { text-align: center; }
  .summary .rate .pct { font-size: 32px; font-weight: 900; color: #22c55e; line-height: 1; }
  .summary .rate .lab { font-size: 9px; color: rgba(255,255,255,0.5); font-weight: 700; }

  .row {
    display: flex; align-items: center; gap: 9px;
    background: rgba(255,255,255,0.02);
    border: 1px solid rgba(255,255,255,0.06);
    border-left: 3px solid #22c55e;
    border-radius: 8px; padding: 7px 10px; margin-bottom: 5px;
  }
  .row.miss { border-left-color: #ef4444; }
  .row .match { flex: 1; min-width: 0; }
  .row .teams { font-size: 12px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row .teams .sc { color: #d4a843; font-weight: 900; margin: 0 3px; }
  .row .pick { font-size: 10px; color: rgba(255,255,255,0.5); margin-top: 1px; }
  .row .pick b { color: #fff; font-weight: 700; }
  .row .tick {
    width: 22px; height: 22px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 13px; font-weight: 900; flex-shrink: 0;
    background: rgba(34,197,94,0.18); color: #22c55e;
  }
  .row.miss .tick { background: rgba(239,68,68,0.18); color: #ef4444; }

  .foot { font-size: 9px; color: rgba(255,255,255,0.3); text-align: center; margin-top: 10px; line-height: 1.5; }
  .foot .gold { color: rgba(212,168,67,0.7); font-weight: 700; }
</style>
</head>
<body>
  <div class="card">
    <div class="brand">
      <div class="logo">EE</div>
      <div class="name">ELITE EDGE <span>SPORTS TIPS</span></div>
    </div>
    <div class="kicker">Consensus Engine · Track Record</div>
    <h1>World Cup 2026 <span class="gold">Scorecard</span></h1>

    <div class="summary">
      <div>
        <div class="rec">Our Record So Far</div>
        <div class="big">13 <span class="mut">won</span> &nbsp;·&nbsp; 2 <span class="mut">lost</span></div>
      </div>
      <div class="rate">
        <div class="pct">87%</div>
        <div class="lab">15 settled picks</div>
      </div>
    </div>

    <div id="rows"></div>

    <div class="foot">
      <span class="gold">ELITE EDGE</span> consensus engine · Elo + Dixon-Coles. Settled group-stage picks.<br>
      18+ | Analysis, not betting advice | BeGambleAware.org
    </div>
  </div>

<script>
  var picks = [
    { h:'🇪🇸 Spain', a:'Cape Verde 🇨🇻', score:'0–0', pick:'Draw', market:'Match Result', hit:true },
    { h:'🇧🇪 Belgium', a:'Egypt 🇪🇬', score:'1–1', pick:'Draw', market:'Match Result', hit:true },
    { h:'🇸🇦 Saudi Arabia', a:'Uruguay 🇺🇾', score:'1–1', pick:'Draw', market:'Match Result', hit:true },
    { h:'🇫🇷 France', a:'Senegal 🇸🇳', score:'0–0', pick:'Under 2.5 Goals', market:'Total Goals', hit:true },
    { h:'🇮🇷 Iran', a:'New Zealand 🇳🇿', score:'2–2', pick:'Over 2.5 Goals', market:'Total Goals', hit:true },
    { h:'🇦🇺 Australia', a:'Türkiye 🇹🇷', score:'2–0', pick:'Under 2.5 Goals', market:'Total Goals', hit:true },
    { h:'🇸🇪 Sweden', a:'Tunisia 🇹🇳', score:'5–1', pick:'BTTS – Yes', market:'Both Teams to Score', hit:true },
    { h:'🇨🇦 Canada', a:'Bosnia & Herz. 🇧🇦', score:'1–1', pick:'Draw', market:'Match Result', hit:true },
    { h:'🇺🇸 USA', a:'Paraguay 🇵🇾', score:'4–1', pick:'United States Win', market:'Match Result', hit:true },
    { h:'🇭🇹 Haiti', a:'Scotland 🏴󠁧󠁢󠁳󠁣󠁴󠁿', score:'0–1', pick:'Under 2.5 Goals', market:'Total Goals', hit:true },
    { h:'🇰🇷 Korea Republic', a:'Czech Rep. 🇨🇿', score:'2–1', pick:'Korea Republic Win', market:'Match Result', hit:true },
    { h:'🇩🇪 Germany', a:'Curaçao 🇨🇼', score:'7–1', pick:'Over 2.5 Goals', market:'Total Goals', hit:true },
    { h:'🇧🇷 Brazil', a:'Morocco 🇲🇦', score:'1–1', pick:'Over 2.5 Goals', market:'Total Goals', hit:false },
    { h:'🇳🇱 Netherlands', a:'Japan 🇯🇵', score:'2–2', pick:'Under 2.5 Goals', market:'Total Goals', hit:false },
    { h:'🇨🇮 Ivory Coast', a:'Ecuador 🇪🇨', score:'1–0', pick:'Ivory Coast Win', market:'Match Result', hit:true }
  ];
  document.getElementById('rows').innerHTML = picks.map(function(p){
    return '<div class="row' + (p.hit ? '' : ' miss') + '">' +
      '<div class="match">' +
        '<div class="teams">' + p.h + ' <span class="sc">' + p.score + '</span> ' + p.a + '</div>' +
        '<div class="pick">Our call: <b>' + p.pick + '</b> · ' + p.market + '</div>' +
      '</div>' +
      '<div class="tick">' + (p.hit ? '✓' : '✗') + '</div>' +
    '</div>';
  }).join('');
</script>
</body>
</html>
