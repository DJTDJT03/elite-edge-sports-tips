<!DOCTYPE html>
<html><head><meta charset="UTF-8"><style>
* { margin: 0; padding: 0; }
body { width: 512px; height: 512px; display: flex; align-items: center; justify-content: center; background: transparent; }
.icon {
  width: 512px; height: 512px; border-radius: 100px;
  background: #0a0e1a;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  border: 6px solid #d4a843;
  box-sizing: border-box;
}
.ee { font-family: -apple-system, Inter, Arial, sans-serif; font-weight: 900; font-size: 190px; color: #d4a843; line-height: 1; }
.sub { font-family: -apple-system, Inter, Arial, sans-serif; font-weight: 700; font-size: 42px; color: #8b8d93; letter-spacing: 8px; margin-top: 10px; }
</style></head>
<body>
<div class="icon">
  <div class="ee">EE</div>
  <div class="sub">ELITE EDGE</div>
</div>
</body></html>
