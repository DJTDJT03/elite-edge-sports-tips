<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1584">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap');
  html, body { width: 1584px; height: 396px; overflow: hidden; }
  body {
    font-family: 'Inter', sans-serif;
    background: linear-gradient(135deg, #0a0e1a 0%, #111827 35%, #0a0e1a 65%, #0f1528 100%);
    position: relative;
    display: flex;
    align-items: center;
  }
  body::before {
    content: ''; position: absolute; top: -150px; left: -100px;
    width: 400px; height: 400px;
    background: radial-gradient(circle, rgba(212,168,67,0.08), transparent 70%);
  }
  body::after {
    content: ''; position: absolute; bottom: -100px; right: 200px;
    width: 350px; height: 350px;
    background: radial-gradient(circle, rgba(34,197,94,0.05), transparent 70%);
  }

  .container {
    display: flex; align-items: center; justify-content: space-between;
    width: 100%; padding: 0 80px; position: relative; z-index: 1;
  }

  .left { display: flex; align-items: center; gap: 32px; }

  .logo-diamond {
    width: 72px; height: 72px;
    border: 3px solid #d4a843;
    transform: rotate(45deg);
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .logo-inner {
    transform: rotate(-45deg);
    color: #d4a843; font-weight: 900; font-size: 26px;
  }

  .brand-text h1 {
    font-size: 36px; font-weight: 900; color: #fff; letter-spacing: -0.5px;
    margin-bottom: 4px;
  }
  .brand-text .sub {
    font-size: 13px; color: #d4a843; text-transform: uppercase;
    letter-spacing: 3px; font-weight: 700;
  }

  .divider {
    width: 2px; height: 120px;
    background: linear-gradient(180deg, transparent, rgba(212,168,67,0.3), transparent);
    margin: 0 40px;
    flex-shrink: 0;
  }

  .stats {
    display: flex; gap: 40px; align-items: center;
  }
  .stat { text-align: center; }
  .stat .num {
    font-size: 32px; font-weight: 900; line-height: 1;
    margin-bottom: 4px;
  }
  .stat .num.green { color: #22c55e; }
  .stat .num.gold { color: #d4a843; }
  .stat .num.white { color: #fff; }
  .stat .lbl {
    font-size: 10px; color: rgba(255,255,255,0.35);
    text-transform: uppercase; letter-spacing: 1.5px; font-weight: 600;
  }

  .right {
    text-align: right;
    flex-shrink: 0;
  }
  .tagline {
    font-size: 18px; color: rgba(255,255,255,0.5);
    font-style: italic; font-weight: 500;
    margin-bottom: 10px;
    line-height: 1.4;
  }
  .url {
    font-size: 15px; font-weight: 700; color: #d4a843;
    letter-spacing: 0.5px;
  }

  .top-line {
    position: absolute; top: 0; left: 0; right: 0; height: 3px;
    background: linear-gradient(90deg, #d4a843, #b8902f, #d4a843);
  }
  .bottom-line {
    position: absolute; bottom: 0; left: 0; right: 0; height: 1px;
    background: linear-gradient(90deg, transparent, rgba(212,168,67,0.2), transparent);
  }
</style>
</head>
<body>
  <div class="top-line"></div>

  <div class="container">
    <div class="left">
      <div class="logo-diamond"><span class="logo-inner">EE</span></div>
      <div class="brand-text">
        <h1>Elite Edge</h1>
        <div class="sub">AI Sports Intelligence</div>
      </div>
    </div>

    <div class="divider"></div>

    <div class="stats">
      <div class="stat"><div class="num green">+74%</div><div class="lbl">ROI</div></div>
      <div class="stat"><div class="num gold">75%</div><div class="lbl">Strike Rate</div></div>
      <div class="stat"><div class="num white">5</div><div class="lbl">AI Analysts</div></div>
      <div class="stat"><div class="num green">140+</div><div class="lbl">Bookmakers</div></div>
    </div>

    <div class="divider"></div>

    <div class="right">
      <div class="tagline">The public watches football.<br>We read it differently.</div>
      <div class="url">eliteedgesports.co.uk</div>
    </div>
  </div>

  <div class="bottom-line"></div>
</body>
</html>
