<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap');
  html, body { width: 1080px; height: 1080px; overflow: hidden; }
  body { font-family: 'Inter', sans-serif; background: linear-gradient(160deg, #0a0e1a 0%, #0f1528 50%, #0a0e1a 100%); position: relative; }
  body::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px; background: linear-gradient(90deg, #d4a843, #b8902f, #d4a843); }
  .pad { padding: 48px; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; z-index: 1; text-align: center; }
  .logo-row { display: flex; align-items: center; gap: 12px; margin-bottom: 32px; }
  .diamond { width: 44px; height: 44px; border: 2px solid #d4a843; transform: rotate(45deg); display: flex; align-items: center; justify-content: center; }
  .diamond span { transform: rotate(-45deg); color: #d4a843; font-weight: 900; font-size: 16px; }
  .brand { font-size: 20px; font-weight: 900; color: #fff; }
  .brand-sub { font-size: 9px; color: #d4a843; text-transform: uppercase; letter-spacing: 2px; font-weight: 700; }
  .trophy { font-size: 80px; margin-bottom: 16px; }
  .title { font-size: 38px; font-weight: 900; color: #d4a843; margin-bottom: 8px; line-height: 1.1; }
  .sub { font-size: 18px; color: rgba(255,255,255,0.5); margin-bottom: 32px; }
  .prize { font-size: 64px; font-weight: 900; color: #22c55e; margin-bottom: 8px; }
  .prize-label { font-size: 14px; color: rgba(255,255,255,0.4); text-transform: uppercase; letter-spacing: 2px; margin-bottom: 32px; }
  .rules { display: flex; gap: 20px; margin-bottom: 36px; }
  .rule { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.06); border-radius: 10px; padding: 16px 20px; text-align: center; flex: 1; }
  .rule .icon { font-size: 24px; margin-bottom: 6px; }
  .rule .txt { font-size: 11px; color: rgba(255,255,255,0.5); font-weight: 600; line-height: 1.4; }
  .free { background: rgba(34,197,94,0.1); border: 1px solid rgba(34,197,94,0.3); padding: 14px 32px; border-radius: 10px; font-size: 16px; font-weight: 800; color: #22c55e; margin-bottom: 16px; }
  .url { font-size: 14px; color: #d4a843; font-weight: 700; }
  .disc { font-size: 9px; color: rgba(255,255,255,0.15); margin-top: 8px; }
</style>
</head>
<body>
<div class="pad">
  <div class="logo-row"><div class="diamond"><span>EE</span></div><div><div class="brand">Elite Edge</div><div class="brand-sub">AI Sports Intelligence</div></div></div>
  <div class="trophy">&#127942;</div>
  <div class="title">LAST MAN STANDING</div>
  <div class="sub">World Cup 2026 Edition</div>
  <div class="prize">&pound;250</div>
  <div class="prize-label">Prize Pool</div>
  <div class="rules">
    <div class="rule"><div class="icon">&#9917;</div><div class="txt">Pick 1 team<br>per matchday</div></div>
    <div class="rule"><div class="icon">&#10060;</div><div class="txt">Wrong pick<br>= eliminated</div></div>
    <div class="rule"><div class="icon">&#128274;</div><div class="txt">Can't reuse<br>same team</div></div>
    <div class="rule"><div class="icon">&#127942;</div><div class="txt">Last one<br>standing wins</div></div>
  </div>
  <div class="free">FREE ENTRY FOR SUBSCRIBERS</div>
  <div class="url">eliteedgesports.co.uk</div>
  <div class="disc">18+ | BeGambleAware.org | T&Cs apply</div>
</div>
</body>
</html>
