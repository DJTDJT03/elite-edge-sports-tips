<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap');
  html,body{width:1080px;height:1080px;overflow:hidden}
  body{font-family:'Inter',sans-serif;background:linear-gradient(160deg,#0a0e1a 0%,#0a1a0a 50%,#0a0e1a 100%);position:relative}
  body::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,#22c55e,#16a34a,#22c55e)}
  body::after{content:'';position:absolute;top:-200px;right:-200px;width:500px;height:500px;background:radial-gradient(circle,rgba(34,197,94,0.08),transparent 70%)}
  .p{padding:48px;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;z-index:1;text-align:center}
  .h{display:flex;align-items:center;gap:12px;margin-bottom:48px}
  .d{width:44px;height:44px;border:2px solid #d4a843;transform:rotate(45deg);display:flex;align-items:center;justify-content:center}
  .d span{transform:rotate(-45deg);color:#d4a843;font-weight:900;font-size:16px}
  .b{font-size:20px;font-weight:900;color:#fff}
  .bs{font-size:9px;color:#d4a843;text-transform:uppercase;letter-spacing:2px;font-weight:700}
  .fire{font-size:80px;margin-bottom:16px}
  .big{font-size:120px;font-weight:900;color:#22c55e;line-height:1;margin-bottom:8px;text-shadow:0 0 60px rgba(34,197,94,0.3)}
  .lab{font-size:24px;font-weight:800;color:rgba(255,255,255,0.5);text-transform:uppercase;letter-spacing:4px;margin-bottom:40px}
  .wins{display:flex;gap:12px;margin-bottom:40px}
  .win{background:rgba(34,197,94,0.08);border:1px solid rgba(34,197,94,0.2);border-radius:10px;padding:12px 16px;text-align:center;min-width:100px}
  .win .sel{font-size:12px;font-weight:700;color:#22c55e}
  .win .det{font-size:10px;color:rgba(255,255,255,0.3);margin-top:2px}
  .tag{font-size:15px;color:rgba(255,255,255,0.4);font-style:italic;margin-bottom:8px}
  .url{font-size:14px;color:#d4a843;font-weight:700}
  .disc{font-size:9px;color:rgba(255,255,255,0.15);margin-top:8px}
</style>
</head>
<body>
<div class="p">
  <div class="h"><div class="d"><span>EE</span></div><div><div class="b">Elite Edge</div><div class="bs">AI Sports Intelligence</div></div></div>
  <div class="fire">&#128293;</div>
  <div class="big">5</div>
  <div class="lab">Winners In A Row</div>
  <div class="wins">
    <div class="win"><div class="sel">Notts County 1X</div><div class="det">25 May</div></div>
    <div class="win"><div class="sel">St Etienne 1X</div><div class="det">26 May</div></div>
    <div class="win"><div class="sel">Palace 1X</div><div class="det">27 May</div></div>
    <div class="win"><div class="sel">Casa Pia 1X</div><div class="det">28 May</div></div>
    <div class="win"><div class="sel">Las Palmas</div><div class="det">31 May</div></div>
  </div>
  <div class="tag">The model is rolling. 78% strike rate overall.</div>
  <div class="url">eliteedgesports.co.uk</div>
  <div class="disc">18+ | BeGambleAware.org</div>
</div>
</body>
</html>
