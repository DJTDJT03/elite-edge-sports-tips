<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap');
  body { font-family: 'Inter', sans-serif; background: #0a0e1a; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
  .card {
    width: 1080px; height: 1080px;
    background: linear-gradient(160deg, #0a0e1a 0%, #0f1528 50%, #0a0e1a 100%);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    position: relative; overflow: hidden;
  }
  .card::before {
    content: ''; position: absolute; top: -300px; right: -300px;
    width: 600px; height: 600px;
    background: radial-gradient(circle, rgba(212,168,67,0.06), transparent 70%);
  }
  .card::after {
    content: ''; position: absolute; bottom: -200px; left: -200px;
    width: 500px; height: 500px;
    background: radial-gradient(circle, rgba(34,197,94,0.04), transparent 70%);
  }
  .inner {
    position: relative; z-index: 1; text-align: center;
    padding: 60px;
  }
  .logo-row {
    display: flex; align-items: center; justify-content: center; gap: 16px;
    margin-bottom: 48px;
  }
  .logo-diamond {
    width: 56px; height: 56px;
    border: 2.5px solid #d4a843; transform: rotate(45deg);
    display: flex; align-items: center; justify-content: center;
  }
  .logo-inner { transform: rotate(-45deg); color: #d4a843; font-weight: 900; font-size: 20px; }
  .brand { font-size: 26px; font-weight: 900; color: #fff; letter-spacing: -0.5px; }
  .brand-sub { font-size: 11px; color: #d4a843; text-transform: uppercase; letter-spacing: 3px; font-weight: 700; }

  .headline {
    font-size: 22px; font-weight: 700; color: rgba(255,255,255,0.4);
    text-transform: uppercase; letter-spacing: 4px; margin-bottom: 40px;
  }

  .stats-grid {
    display: grid; grid-template-columns: 1fr 1fr; gap: 24px;
    margin-bottom: 48px; width: 100%; max-width: 640px;
  }
  .stat-box {
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(212,168,67,0.15);
    border-radius: 16px; padding: 32px 20px; text-align: center;
  }
  .stat-value {
    font-size: 52px; font-weight: 900; line-height: 1;
    margin-bottom: 8px;
  }
  .stat-value.gold { color: #d4a843; }
  .stat-value.green { color: #22c55e; }
  .stat-label {
    font-size: 13px; color: rgba(255,255,255,0.4);
    text-transform: uppercase; letter-spacing: 2px; font-weight: 700;
  }

  .divider {
    width: 80px; height: 3px;
    background: linear-gradient(90deg, transparent, #d4a843, transparent);
    margin: 0 auto 40px;
  }

  .tagline {
    font-size: 18px; color: rgba(255,255,255,0.5); font-weight: 500;
    font-style: italic; margin-bottom: 12px;
  }
  .url {
    font-size: 16px; font-weight: 700; color: #d4a843;
    margin-bottom: 32px;
  }

  .disclaimer {
    font-size: 10px; color: rgba(255,255,255,0.2);
    position: absolute; bottom: 24px; left: 0; right: 0; text-align: center;
  }
</style>
</head>
<body>
<div class="card">
  <div class="inner">
    <div class="logo-row">
      <div class="logo-diamond"><span class="logo-inner">EE</span></div>
      <div>
        <div class="brand">Elite Edge</div>
        <div class="brand-sub">Sports Tips</div>
      </div>
    </div>

    <div class="headline">Verified Performance</div>

    <div class="stats-grid">
      <div class="stat-box">
        <div class="stat-value green">+74%</div>
        <div class="stat-label">ROI</div>
      </div>
      <div class="stat-box">
        <div class="stat-value gold">75%</div>
        <div class="stat-label">Strike Rate</div>
      </div>
      <div class="stat-box">
        <div class="stat-value green">+33.29</div>
        <div class="stat-label">Units Profit</div>
      </div>
      <div class="stat-box">
        <div class="stat-value gold">24</div>
        <div class="stat-label">Verified Tips</div>
      </div>
    </div>

    <div class="divider"></div>

    <div class="tagline">The public watches football. We read it differently.</div>
    <div class="url">eliteedgesports.co.uk</div>
  </div>

  <div class="disclaimer">18+ only. Please gamble responsibly. BeGambleAware.org. Past performance does not guarantee future results.</div>
</div>
</body>
</html>
